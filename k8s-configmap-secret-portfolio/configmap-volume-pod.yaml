apiVersion: v1
kind: Pod
metadata:
  name: configmap-volume-pod
  namespace: config-lab
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      volumeMounts:
        - name: config-volume
          mountPath: /etc/app-config
          readOnly: true
  volumes:
    - name: config-volume
      configMap:
        name: web-config
