apiVersion: apps/v1
kind: Deployment
metadata:
  name: configmap-web
  namespace: config-lab
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: configmap-web
  template:
    metadata:
      labels:
        app: configmap-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          env:
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: web-config
                  key: LOG_LEVEL
            - name: APP_MODE
              valueFrom:
                configMapKeyRef:
                  name: web-config
                  key: APP_MODE
          volumeMounts:
            - name: config-volume
              mountPath: /etc/app-config
              readOnly: true
      volumes:
        - name: config-volume
          configMap:
            name: web-config
