apiVersion: v1
kind: Pod
metadata:
  name: probe-exec-demo
  namespace: probe-resource-lab
  labels:
    app: probe-exec-demo
spec:
  containers:
    - name: nginx
      image: nginx:1.28-alpine
      readinessProbe:
        exec:
          command:
            - /bin/sh
            - -c
            - test -f /usr/share/nginx/html/index.html
        initialDelaySeconds: 3
        periodSeconds: 5
        timeoutSeconds: 2
        successThreshold: 1
        failureThreshold: 3
