apiVersion: v1
kind: Pod
metadata:
  name: probe-tcp-demo
  namespace: probe-resource-lab
  labels:
    app: probe-tcp-demo
spec:
  containers:
    - name: nginx
      image: nginx:1.28-alpine
      ports:
        - containerPort: 80
      readinessProbe:
        tcpSocket:
          port: 80
        initialDelaySeconds: 3
        periodSeconds: 5
        timeoutSeconds: 2
        successThreshold: 1
        failureThreshold: 3
