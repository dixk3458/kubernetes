apiVersion: v1
kind: Pod
metadata:
  name: secret-volume-pod
  namespace: config-lab
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      volumeMounts:
        - name: secret-volume
          mountPath: /etc/db-secret
          readOnly: true
  volumes:
    - name: secret-volume
      secret:
        secretName: db-secret
