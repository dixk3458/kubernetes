apiVersion: v1
kind: Pod
metadata:
  name: secret-env-pod
  namespace: config-lab
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      env:
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: DB_USERNAME

        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: DB_PASSWORD
