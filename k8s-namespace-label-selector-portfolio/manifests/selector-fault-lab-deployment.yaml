apiVersion: apps/v1
kind: Deployment
metadata:
  name: selector-web
  namespace: selector-fault-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: selector-web
  template:
    metadata:
      labels:
        app: selector-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          ports:
            - containerPort: 80
