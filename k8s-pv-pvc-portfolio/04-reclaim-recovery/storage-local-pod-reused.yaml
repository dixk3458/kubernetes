apiVersion: v1
kind: Pod
metadata:
  name: storage-local-pod-reused
  namespace: storage-lab
spec:
  containers:
    - name: nginx
      image: nginx:1.28-alpine
      volumeMounts:
        - name: local-storage
          mountPath: /data
  volumes:
    - name: local-storage
      persistentVolumeClaim:
        claimName: storage-local-pvc-reused
