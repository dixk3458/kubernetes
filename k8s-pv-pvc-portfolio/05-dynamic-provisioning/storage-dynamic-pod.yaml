apiVersion: v1
kind: Pod
metadata:
  name: storage-dynamic-pod
  namespace: storage-lab
spec:
  nodeSelector:
    kubernetes.io/hostname: k8s-worker2
  containers:
    - name: nginx
      image: nginx:1.28-alpine
      volumeMounts:
        - name: dynamic-storage
          mountPath: /data
  volumes:
    - name: dynamic-storage
      persistentVolumeClaim:
        claimName: storage-dynamic-pvc
