apiVersion: v1
kind: Pod
metadata:
  name: cpu-throttle-demo
  namespace: probe-resource-lab
  labels:
    app: cpu-throttle-demo
spec:
  containers:
    - name: cpu-test
      image: nginx:1.28-alpine
      command:
        - /bin/sh
        - -c
      args:
        - "while true; do sleep 3600; done"
      resources:
        requests:
          cpu: "50m"
        limits:
          cpu: "100m"
