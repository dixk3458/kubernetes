apiVersion: apps/v1
kind: Deployment
metadata:
  name: troubleshoot-integrated
  namespace: probe-resource-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: troubleshoot-integrated
  template:
    metadata:
      labels:
        app: troubleshoot-integrated
    spec:
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          ports:
            - containerPort: 80
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - "touch /usr/share/nginx/html/readyz"
          resources:
            requests:
              cpu: "500m"
              memory: "64Mi"
            limits:
              memory: "128Mi"
          startupProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /readyz
              port: 80
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
            failureThreshold: 3
